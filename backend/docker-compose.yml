# backend/docker-compose.yml
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: chirp
      POSTGRES_USER: chirp
      POSTGRES_PASSWORD: chirp
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9010:9000"   # S3 API — this is what boto3/presigned URLs hit
      - "9011:9001"   # Web console — browse buckets/objects at http://localhost:9001
    volumes:
      - miniodata:/data


volumes:
  pgdata:
  miniodata: