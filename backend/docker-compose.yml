# backend/docker-compose.yml
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: chirp
      POSTGRES_USER: chirp
      POSTGRES_PASSWORD: chirp
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata: